<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>VRM Viewer — открыть модель</title>
<style>
  body { margin:0; font:14px system-ui; background:#111; color:#ccc; }
  #bar { padding:10px 14px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #333;}
  #bar b {color:#fff}
  canvas { display:block; }
  #drop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          font-size:22px; color:#888; pointer-events:none; }
  input#file { } /* styled by label */
  #hint { color:#777; font-size:12px; }
  #pick { display:inline-block; padding:8px 18px; background:#3a6ea5; color:#fff; border-radius:6px; cursor:pointer; font-weight:600; }
  #pick:hover { background:#4a7db6; }
  #file { display:none; }
  #status { color:#9fe089; font-weight:600; }
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js",
            "three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="bar">
  <b>VRM Viewer</b>
  <label id="pick" for="file">📂 Выбрать VRM-файл</label>
  <input type="file" id="file" accept=".vrm">
  <span id="status"></span>
  <span id="hint">выбери .vrm (например character-work/rin-kkbp-session-2026-10-14/Rin_Hybrid_v12.vrm), крутить — мышью, зум — колесом</span>
</div>
<div id="drop">выбери файл .vrm сверху</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb2c8);
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 1.3, 4);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
// свет следует за камерой: вращая модель, всегда видишь освещённую сторону
const dl=new THREE.DirectionalLight(0xffffff, Math.PI*0.35);
dl.position.set(0.3, 0.4, 1);
scene.add(camera);
camera.add(dl);
scene.add(new THREE.AmbientLight(0xffffff, Math.PI*0.28));
let loaded=null, currentScene=null;
function setStatus(t, bad){ const st=document.getElementById('status'); st.textContent=t; st.style.color = bad ? '#ff8080' : '#9fe089'; }
async function loadFromBlobOrUrl(src) {
  const isUrl = typeof src === 'string';
  const name = isUrl ? decodeURIComponent(src.split('/').pop().split('?')[0]) : src.name;
  const st = document.getElementById('status');
  st.textContent = 'загружаю ' + name + ' …';
  st.style.color = '#9fe089';
  const { VRMLoaderPlugin, VRMUtils } = await import('./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js');
  const loader = new GLTFLoader();
  loader.register((p) => new VRMLoaderPlugin(p));
  const url = isUrl ? src : URL.createObjectURL(src);
  if (currentScene) { scene.remove(currentScene); }
  loader.load(url, (gltf) => {
    const vrm = gltf.userData.vrm;
        loaded = vrm; window.__loaded = vrm; currentScene = gltf.scene;
    scene.add(gltf.scene);
    gltf.scene.rotation.y = Math.PI;
    document.getElementById('drop').style.display = 'none';
    // разогрев springbone: 90 тихих кадров симуляции до первого показа,
    // чтобы стартовый дёрг суставов не был виден пользователю
    for (let i = 0; i < 90; i++) { try { vrm.update(1/30); } catch (e) {} }
    if (vrm.expressionManager) { try { vrm.expressionManager.setValue('relaxed', 0.4); } catch (e) {} }
    st.textContent = 'LOADED: ' + name + ' ✓';
    document.title = 'LOADED: ' + name;
    // одежда (не Body) рисуется поверх тела: игровой трюк против пересечений
  }, undefined, (err) => {
    st.textContent = 'ОШИБКА: ' + (err.message || err);
    st.style.color = '#ff8080';
    document.title = 'LOAD_FAIL: ' + (err.message || err);
  });
}
document.getElementById('file').addEventListener('change', (e) => {
  if (e.target.files[0]) loadFromBlobOrUrl(e.target.files[0]);
});
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFromBlobOrUrl(f);
});
(function loop() {
  controls.update();
  if (loaded) {
    // живой idle: дыхание корпуса, микрокивания головы и плеч — волосы и
    // юбка реагируют как в игре; амплитуды малые, симуляция непрерывная
    const t = performance.now() / 1000;
    try {
      const hum = loaded.humanoid;
      const spine = hum.getNormalizedBoneNode('spine');
      const chest = hum.getNormalizedBoneNode('chest');
      const head = hum.getNormalizedBoneNode('head');
      const shL = hum.getNormalizedBoneNode('leftShoulder');
      const shR = hum.getNormalizedBoneNode('rightShoulder');
      if (spine) { spine.rotation.x = Math.sin(t * 1.05) * 0.014; spine.rotation.y = Math.sin(t * 0.7) * 0.01; }
      if (chest) { chest.rotation.x = Math.sin(t * 2.1) * 0.008; chest.rotation.z = Math.sin(t * 0.5 + 1) * 0.006; }
      if (head)  { head.rotation.x = Math.sin(t * 0.9 + 0.6) * 0.02; head.rotation.z = Math.sin(t * 0.6) * 0.015; head.rotation.y = Math.sin(t * 0.45 + 2) * 0.06; }
      if (shL && shR) { const s = Math.sin(t * 1.3) * 0.01; shL.rotation.z = 0.02 + s; shR.rotation.z = -0.02 - s; }
    } catch (e) {}
    loaded.update(0.016);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__cam=camera; window.__controls=controls; window.__scene=scene;
const qvrm = new URLSearchParams(location.search).get('vrm');
if (qvrm) loadFromBlobOrUrl(new URL(qvrm, location.href).href);
</script>
</body>
</html>
