<html lang="ru"><head><meta charset="utf-8"><title>Покрытие: только ткань / тело+ткань</title>

<style>body{margin:0;background:#0f1116;color:#ddd;font:12px system-ui}#g{display:flex;gap:10px;padding:10px}figure{margin:0;background:#171a21;border-radius:10px;padding-bottom:6px}figcaption{padding:6px 8px;color:#9fb}</style>
</head><body>
<div id="g"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin, VRMUtils} from '../viewer/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js';
const W=460,H=560, loader=new GLTFLoader(); loader.register(p=>new VRMLoaderPlugin(p));
const gltf=await loader.loadAsync('../characters/mira/Mira_outfit_03.vrm');
const vrm=gltf.userData.vrm; VRMUtils.removeUnnecessaryVertices(vrm.scene);
const body=vrm.scene.getObjectByProperty('isSkinnedMesh',true);
const g=await new GLTFLoader().loadAsync('./items/kk/kk-tops-ofcard-b.glb');
const src=g.scene.getObjectByProperty('isSkinnedMesh',true);
src.skeleton=body.skeleton; src.bindMatrix.copy(body.bindMatrix); src.bindMatrixInverse.copy(body.bindMatrixInverse);
src.material.side=THREE.DoubleSide; src.material.color.setRGB(1,0.05,0.05); src.frustumCulled=false;

for(const[k,[x,y,z]]of Object.entries(pose)){const n=vrm.humanoid.getRawBoneNode(k); if(n)n.rotation.set(x,y,z);}
vrm.scene.updateMatrixWorld(true);
const out=[];
for(const hide of [true,false]){
  const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const fig=document.createElement('figure'); const cap=document.createElement('figcaption');
  cap.textContent=hide?'только ткань (тело скрыто)':'тело + ткань (ткань красная)';
  fig.append(canvas,cap); document.getElementById('g').append(fig);
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x171a21);
  scene.add(new THREE.AmbientLight(0xffffff,1.3));
  const l=new THREE.DirectionalLight(0xffffff,2.0); l.position.set(1,2,1.8); scene.add(l);
  const l2=new THREE.DirectionalLight(0x99aaff,0.7); l2.position.set(-1.5,1,1); scene.add(l2);
  scene.add(vrm.scene); scene.add(src);
  body.visible=!hide;
  const r=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H,false);
  const cam=new THREE.PerspectiveCamera(26,W/H,0.1,20); cam.position.set(0.5,1.28,1.15); cam.lookAt(0,1.24,0);
  r.render(scene,cam); out.push({hide, ok:true});
}
window.__cov={ready:true,out};
</script></body></html>
