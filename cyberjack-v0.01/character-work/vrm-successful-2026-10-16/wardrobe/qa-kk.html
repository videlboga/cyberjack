<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Одежда из zipmod Koikatsu на VRM</title>
<script type="importmap">
{"imports":{
  "three":"../viewer/node_modules/three/build/three.module.js",
  "three/addons/":"../viewer/node_modules/three/examples/jsm/"
}}
</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#111318;color:#e8e8ea;font:12px/1.35 system-ui,sans-serif}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
  figure{margin:0;background:#181b22;border-radius:8px;overflow:hidden}
  figcaption{padding:6px 8px;color:#aab}
  canvas{display:block;width:100%;height:auto}
  #status{padding:8px;color:#8ab;white-space:pre-wrap}
</style>
</head>
<body>
<div id="status">загрузка…</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin, VRMUtils} from '../viewer/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js';
import {Wardrobe} from './wardrobe.js';

const W = 400, H = 580;
const status = document.getElementById('status');
const grid = document.getElementById('grid');
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

const PANELS = [
  {label: 'zipmod: вариант a (o_top_ofcard_a)', items: ['kk-tops-ofcard-a'], native: false},
  {label: 'zipmod: вариант b (o_top_ofcard_b)', items: ['kk-tops-ofcard-b'], native: false},
  {label: 'нативный Mira_outfit_00 (референс)', items: [], native: true},
];

const POSE = {
  spine: [0.12, 0, 0.05], chest: [0.06, 0, 0.04],
  leftUpperArm: [0.1, 0, -0.55], rightUpperArm: [0.05, 0, 0.35],
  leftLowerArm: [-0.5, 0, 0], rightLowerArm: [-0.25, 0, 0],
  leftUpperLeg: [0.35, 0, 0.05], rightUpperLeg: [-0.15, 0, -0.05],
  leftLowerLeg: [-0.45, 0, 0],
};

const views = [];
for (const p of PANELS) {
  const fig = document.createElement('figure');
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const cap = document.createElement('figcaption');
  cap.textContent = p.label;
  fig.append(canvas, cap);
  grid.append(fig);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x181b22);
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
  renderer.setSize(W, H, false);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 20);
  camera.position.set(1.1, 1.05, 2.3);
  camera.lookAt(0, 1.0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 1.25));
  const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(1.3, 2.3, 2.1); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.8); rim.position.set(-2, 1.5, -1.4); scene.add(rim);
  views.push({panel: p, scene, renderer, camera});
}

const report = [];
for (const v of views) {
  const url = v.panel.native ? '../characters/mira/Mira_outfit_00.vrm' : '../characters/mira/Mira_outfit_03.vrm';
  const gltf = await loader.loadAsync(url);
  const vrm = gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(vrm.scene);
  vrm.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  v.scene.add(vrm.scene);
  let info = {label: v.panel.label};
  if (v.panel.items.length) {
    const wardrobe = new Wardrobe(vrm);
    await wardrobe.init('./wardrobe.json');
    const meshes = await wardrobe.setOutfit({top: v.panel.items[0]});
    const rec = [...wardrobe.equipped.values()][0];
    const pos = rec.mesh.geometry.attributes.position;
    const box = new THREE.Box3().setFromBufferAttribute(pos);
    info = {...info, item: rec.item.id, source: rec.item.outfit,
            verts: pos.count, bbox: [box.min.toArray().map(n => +n.toFixed(2)), box.max.toArray().map(n => +n.toFixed(2))]};
  }
  for (const [bone, [x, y, z]] of Object.entries(POSE)) {
    const node = vrm.humanoid.getRawBoneNode(bone);
    if (node) node.rotation.set(x, y, z);
  }
  vrm.scene.updateMatrixWorld(true);
  v.renderer.render(v.scene, v.camera);
  report.push(info);
}

status.textContent = 'готово\n' + report.map(r => `${r.label}${r.verts ? ' · ' + r.verts + ' вершин · bbox ' + JSON.stringify(r.bbox) : ''}`).join('\n');
window.__kk = {ready: true, report};
window.__render = () => { for (const v of views) { v.scene.updateMatrixWorld(true); v.renderer.render(v.scene, v.camera); } };
</script>
</body>
</html>
