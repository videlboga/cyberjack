<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новые вещи из zipmod: шорты, обувь, колготки, носки, шея, голова</title>
<script type="importmap">
{"imports":{
  "three":"../viewer/node_modules/three/build/three.module.js",
  "three/addons/":"../viewer/node_modules/three/examples/jsm/"
}}
</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0f1116;color:#e8e8ea;font:12px/1.3 system-ui,sans-serif}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}
  figure{margin:0;background:#171a21;border-radius:10px;overflow:hidden}
  figcaption{padding:7px 9px;color:#9fb;min-height:28px}
  canvas{display:block;width:100%;height:auto}
  #status{padding:8px 10px;color:#7a9;white-space:pre-wrap}
</style>
</head>
<body>
<div id="status">загрузка…</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin, VRMUtils} from '../viewer/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js';

const W = 360, H = 600;
const status = document.getElementById('status');
const grid = document.getElementById('grid');
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

// цвета по категориям, чтобы вещи читались на кадре
const COLORS = {
  bottom: [0.18, 0.22, 0.38], shoes: [0.08, 0.08, 0.09], socks: [0.05, 0.05, 0.06],
  head: [0.42, 0.10, 0.16], neck: [0.10, 0.09, 0.12],
};

const PANELS = [
  {label: 'шорты + туфли на каблуке', items: [['kk-hotpants','bottom'], ['kk-strappy-heels','shoes']]},
  {label: 'колготки + туфли + чокер на шею', items: [['kk-pantyhose','socks'], ['kk-strappy-heels','shoes'], ['kk-collar','neck']]},
  {label: 'гольфы до колена + туфли', items: [['kk-line-socks','socks'], ['kk-strappy-heels','shoes']]},
  {label: 'всё сразу: шляпа, чокер, шорты, колготки, туфли',
   items: [['kk-tophat','head'], ['kk-collar','neck'], ['kk-hotpants','bottom'], ['kk-pantyhose','socks'], ['kk-strappy-heels','shoes']]},
];

const POSE = {
  hips: [0, 0.1, 0], spine: [0.06, 0, 0.04], chest: [0.04, 0, 0.02], head: [0.02, 0.12, 0],
  leftUpperArm: [0.05, 0, -0.6], rightUpperArm: [0.1, 0, 0.4],
  leftLowerArm: [-0.5, 0, 0], rightLowerArm: [-0.28, 0, 0],
  leftUpperLeg: [0.18, 0, 0.04], rightUpperLeg: [-0.1, 0, -0.03],
  leftLowerLeg: [-0.22, 0, 0], rightLowerLeg: [-0.05, 0, 0],
};

const views = [];
for (const panel of PANELS) {
  const fig = document.createElement('figure');
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const cap = document.createElement('figcaption'); cap.textContent = panel.label;
  fig.append(canvas, cap); grid.append(fig);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x171a21);
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
  renderer.setSize(W, H, false);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 20);
  camera.position.set(1.5, 0.95, 2.6);
  camera.lookAt(0, 0.9, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 1.25));
  const key = new THREE.DirectionalLight(0xffffff, 1.9); key.position.set(1.4, 2.2, 2.0); scene.add(key);
  const fill = new THREE.DirectionalLight(0x99aaff, 0.75); fill.position.set(-1.8, 1.2, 1.2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xaaccff, 0.6); rim.position.set(-1.2, 1.5, -1.8); scene.add(rim);
  views.push({panel, scene, renderer, camera});
}

const summary = [];
for (const view of views) {
  const gltf = await loader.loadAsync('../characters/mira/Mira_outfit_03.vrm');
  const vrm = gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(vrm.scene);
  vrm.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  view.scene.add(vrm.scene);
  const body = vrm.scene.getObjectByProperty('isSkinnedMesh', true);
  const loaded = [];
  for (const [id, slot] of view.panel.items) {
    const gl = await new GLTFLoader().loadAsync(`./items/kk/${id}.glb`);
    const src = gl.scene.getObjectByProperty('isSkinnedMesh', true);
    src.skeleton = body.skeleton;
    src.bindMatrix.copy(body.bindMatrix);
    src.bindMatrixInverse.copy(body.bindMatrixInverse);
    src.frustumCulled = false;
    const rgb = COLORS[slot] || [0.5, 0.5, 0.55];
    for (const m of (Array.isArray(src.material) ? src.material : [src.material])) {
      m.side = THREE.DoubleSide;
      m.color?.setRGB(...rgb);
      if (m.emissive) m.emissive.setRGB(0, 0, 0);
      m.transparent = false; m.opacity = 1;
    }
    view.scene.add(src);
    const box = new THREE.Box3().setFromBufferAttribute(src.geometry.attributes.position);
    loaded.push({id, slot, verts: src.geometry.attributes.position.count,
                 y: [+box.min.y.toFixed(2), +box.max.y.toFixed(2)]});
  }
  for (const [bone, [x, y, z]] of Object.entries(POSE)) {
    const node = vrm.humanoid.getRawBoneNode(bone);
    if (node) node.rotation.set(x, y, z);
  }
  vrm.scene.updateMatrixWorld(true);
  view.renderer.render(view.scene, view.camera);
  summary.push({label: view.panel.label, items: loaded});
  status.textContent = `готово ${summary.length}/${views.length}`;
}

status.textContent = 'готово';
window.__new = {ready: true, summary};
window.__render = () => { for (const v of views) { v.scene.updateMatrixWorld(true); v.renderer.render(v.scene, v.camera); } };
</script>
</body>
</html>
