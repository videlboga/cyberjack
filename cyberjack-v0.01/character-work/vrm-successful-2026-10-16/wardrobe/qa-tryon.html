<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Гардероб · примерка</title>
<script type="importmap">
{"imports":{
  "three":"../viewer/node_modules/three/build/three.module.js",
  "three/addons/":"../viewer/node_modules/three/examples/jsm/"
}}
</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#111318;color:#e8e8ea;font:12px/1.35 system-ui,sans-serif}
  #grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
  figure{margin:0;background:#181b22;border-radius:8px;overflow:hidden}
  figcaption{padding:6px 8px;color:#aab}
  canvas{display:block;width:100%;height:auto}
  #status{padding:8px;color:#8ab;white-space:pre-wrap}
</style>
</head>
<body>
<div id="status">загрузка…</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin, VRMUtils} from '../viewer/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js';
import {Wardrobe} from './wardrobe.js';

const W = 440, H = 600;
const status = document.getElementById('status');
const grid = document.getElementById('grid');
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

const OUTFITS = [
  {label: 'куртка + шорты + носки + ботинки + чокер',
   set: {top: 'mira-00-kk-pufferlong-8400', bottom: 'mira-01-kk-cf-m-shorts-03-8591',
         socks: 'mira-00-kk-ztoki-socks-02-00-ma-8780', shoes: 'mira-00-kk-m-cf-shoes-steampunk00-8900',
         accessory: ['mira-00-kk-acs-chocker-belt-4760', 'mira-00-kk-acs-m-chocker-bell-4770']}},
  {label: 'бельё: браузер + трусики',
   set: {underwear_top: 'mira-00-kk-bra-lace-mat-8560', underwear_bottom: 'mira-00-kk-panties-highleg-mat-8660'}},
  {label: 'платье anonep (одна вещь из двух частей)',
   set: {dress: 'mira-02-kk-cf-top-aonep-m-8372'}},
  {label: 'без одежды (контроль)',
   set: {}},
];

const POSE = {
  hips: [0, 0.25, 0],
  spine: [0.18, 0, 0.10],
  chest: [0.10, 0, 0.06],
  leftUpperArm: [-0.35, 0, -1.15],
  rightUpperArm: [0.2, 0, 0.9],
  leftLowerArm: [-0.9, 0, 0],
  rightLowerArm: [-0.7, 0, 0],
  leftUpperLeg: [0.75, 0, 0.12],
  rightUpperLeg: [-0.35, 0, -0.08],
  leftLowerLeg: [-0.95, 0, 0],
  rightLowerLeg: [-0.25, 0, 0],
  head: [0.05, 0.2, 0],
};

const views = [];
for (const outfit of OUTFITS) {
  const fig = document.createElement('figure');
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const cap = document.createElement('figcaption');
  cap.textContent = outfit.label;
  fig.append(canvas, cap);
  grid.append(fig);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x181b22);
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
  renderer.setSize(W, H, false);
  renderer.setPixelRatio(1);
  const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 20);
  camera.position.set(1.35, 1.05, 2.55);
  camera.lookAt(0, 0.95, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(1.3, 2.4, 2.2); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.8); rim.position.set(-2, 1.5, -1.4); scene.add(rim);
  views.push({outfit, scene, renderer, camera});
}

status.textContent = 'загружаю тело и гардероб…';
const manifestUrl = './wardrobe.json';
const states = [];
for (const view of views) {
  const gltf = await loader.loadAsync('../characters/mira/Mira_outfit_03.vrm');
  const vrm = gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(vrm.scene);
  vrm.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  view.scene.add(vrm.scene);
  const wardrobe = new Wardrobe(vrm);
  await wardrobe.init(manifestUrl);
  await wardrobe.setOutfit(view.outfit.set);
  for (const [bone, [x, y, z]] of Object.entries(POSE)) {
    const node = vrm.humanoid.getRawBoneNode(bone);
    if (node) node.rotation.set(x, y, z);
  }
  vrm.scene.updateMatrixWorld(true);
  view.renderer.render(view.scene, view.camera);
  states.push({label: view.outfit.label, state: wardrobe.state, detail: wardrobe.detail,
               slots: Object.keys(wardrobe.state), bones: wardrobe.bodyMesh.skeleton.bones.length});
  status.textContent = `готово · ${states.length}/${views.length}\n` +
    states.map(s => `${s.label}: ${Object.keys(s.state).length} слотов`).join('\n');
}
status.textContent += `\nкостей: ${states[0].bones} · панель 4 — контроль без одежды`;
window.__tryon = {ready: true, states};
window.__render = () => { for (const v of views) { v.scene.updateMatrixWorld(true); v.renderer.render(v.scene, v.camera); } };
</script>
</body>
</html>
