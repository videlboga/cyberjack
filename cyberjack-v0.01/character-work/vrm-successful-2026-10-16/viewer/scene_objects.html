const $=s=>document.querySelector(s),stage=$('#stage'),scene=new T.Scene();scene.background=new T.Color(0xced3da);const camera=new T.PerspectiveCamera(40,1,.001,10000),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x777f8d,2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(3,5,4);scene.add(light);const grid=new T.GridHelper(10,20,0xa3adba,0xb8c1cd);scene.add(grid);let model=null,token=0,catalog=null,rows=[],sourceVisibility={};
