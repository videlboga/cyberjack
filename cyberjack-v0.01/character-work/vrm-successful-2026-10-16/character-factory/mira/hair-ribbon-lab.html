<aside><b>Мира · физика одного локона</b><p>Пучок из пяти связанных направляющих с переменной шириной и разделёнными концами. Плечо и пол участвуют в расчёте контактов.</p><button id="play">Пауза</button><button id="reset">Сброс</button><label><input id="move" type="checkbox" checked> Движение корня</label><label><input id="wire" type="checkbox"> Каркас ленты</label><label><input id="loop" type="checkbox" checked> Старт с петлёй на полу</label><label>Высота корня <input id="root-height" type="range" min="0.4" max="2" step="0.05" value="1.85"></label><label>Жёсткость изгиба <input id="bend-strength" type="range" min="0" max="1" step="0.01" value="0.48"></label><label>Длина <input id="length" type="range" min="1.8" max="3.5" step="0.1" value="2.8"></label><label>Завиток <input id="curl" type="range" min="0" max="0.6" step="0.01" value="0.25"></label><label>Скручивание <input id="twist" type="range" min="-0.6" max="0.6" step="0.01" value="0.03"></label><p id="stats"></p><small>Прототип: контакты сетки, продольный и поперечный изгиб, локальное скручивание. Самоколлизии и точная поверхность тела пока не подключены.</small></aside>
