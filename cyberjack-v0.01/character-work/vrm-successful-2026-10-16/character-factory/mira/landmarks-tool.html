<!doctype html><meta charset=utf-8>
<style>
body{margin:0;font:13px/1.4 system-ui,sans-serif;color:var(--foreground);background:transparent}
.wrap{display:flex;gap:16px;flex-wrap:wrap}
.panel{position:relative;user-select:none}
.panel img{display:block;border-radius:8px;border:1px solid var(--border);cursor:crosshair}
.mk{position:absolute;left:0;right:0;height:0;border-top:1px dashed #ff6b6b;pointer-events:none}
.mk span{position:absolute;right:2px;top:-15px;font-size:11px;color:#ff9b9b;background:rgba(0,0,0,.55);padding:0 3px;border-radius:3px}
h3{margin:0 0 6px;font-size:13px;color:var(--muted-foreground);font-weight:600}
table{border-collapse:collapse;margin-top:10px;font-size:12px}
td,th{border:1px solid var(--border);padding:2px 8px;text-align:right}
th{color:var(--muted-foreground);font-weight:600}
button{margin-top:10px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--accent);color:inherit;cursor:pointer}
.hint{color:var(--muted-foreground);font-size:12px;margin:4px 0 10px}
</style>
<div class=hint>Клик по картинке ставит точку по порядку: макушка, подбородок, плечи, грудь (соски), талия, бёдра, пах, колено, щиколотка, подошва. Повторный клик по панели переставляет текущую точку. Кнопка «Сброс» очищает панель.</div>

<table id=tbl></table>
<button id=send>Отправить разметку</button>
<button id=reset>Сброс</button>
<script>
const LM=["макушка", "подбородок", "плечи", "грудь (соски)", "талия", "бёдра", "пах", "колено", "щиколотка", "подошва"];
const state={ref:[],ours:[]};
function pct(y,img){const h=img.naturalHeight||img.height;return {top:(y/h*100),bot:(100-y/h*100)}}
function draw(side){
  const panel=document.getElementById('p_'+side);
  panel.querySelectorAll('.mk').forEach(e=>e.remove());
  state[side].forEach((y,i)=>{
    const el=document.createElement('div'); el.className='mk'; el.style.top=y+'px';
    el.innerHTML='<span>'+(LM[i]||'?')+'</span>'; panel.appendChild(el);
  });
  render();
}
function render(){
  let h='<tr><th>точка</th><th>реф, % сверху</th><th>наша, % сверху</th><th>Δ</th></tr>';
  for(let i=0;i<LM.length;i++){
    const r=state.ref[i]!==undefined?pct(state.ref[i],document.getElementById('i_ref')).top:null;
    const o=state.ours[i]!==undefined?pct(state.ours[i],document.getElementById('i_ours')).top:null;
    h+='<tr><td>'+LM[i]+'</td><td>'+(r!==null?r.toFixed(1):'—')+'</td><td>'+(o!==null?o.toFixed(1):'—')+'</td><td>'+((r!==null&&o!==null)?(o-r).toFixed(1):'—')+'</td></tr>';
  }
  document.getElementById('tbl').innerHTML=h;
}
['ref','ours'].forEach(side=>{
  const img=document.getElementById('i_'+side);
  img.parentElement.addEventListener('click',e=>{
    const r=img.getBoundingClientRect();
    const y=e.clientY-r.top;
    const i=state[side].length<LM.length?state[side].length:LM.length-1;
    if(state[side].length<LM.length) state[side].push(y); else state[side][i]=y;
    draw(side);
  });
});
document.getElementById('reset').onclick=()=>{state.ref=[];state.ours=[];draw('ref');draw('ours');};
document.getElementById('send').onclick=()=>{
  const out={};
  for(let i=0;i<LM.length;i++){
    const r=state.ref[i]!==undefined?pct(state.ref[i],document.getElementById('i_ref')):null;
    const o=state.ours[i]!==undefined?pct(state.ours[i],document.getElementById('i_ours')):null;
    out[LM[i]]={ref_top:r?+r.top.toFixed(1):null, ours_top:o?+o.top.toFixed(1):null};
  }
  window.hermes.send('Разметка ориентиров (проценты сверху по росту): '+JSON.stringify(out));
};
</script>
