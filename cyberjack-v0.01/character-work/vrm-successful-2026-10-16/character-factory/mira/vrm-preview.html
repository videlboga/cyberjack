<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка VRM 1.0</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#14161c;color:#e8ecf3;font:13px system-ui}canvas{width:100%;height:100%;display:block}aside{position:absolute;right:12px;top:12px;width:265px;background:#191e29ee;border:1px solid #354054;border-radius:9px;padding:12px;max-height:calc(100vh - 48px);overflow:auto}button,select{padding:6px;background:#252d3a;color:#e8ecf3;border:1px solid #465572;border-radius:5px;margin:3px}label{display:block;margin:10px 0}input[type=range]{width:100%;accent-color:#5aa9ff}#status{font-size:11px;color:#a6b8ce;margin-top:8px;overflow-wrap:anywhere}</style>
<canvas id="c"></canvas><aside><b>Проверка VRM 1.0</b><p>Независимая загрузка готового файла</p><button id="open">Открыть .vrm</button><input id="file" hidden type="file" accept=".vrm"><button id="fit">Вписать</button><button id="head">Лицо крупно</button><label>Выражение<select id="expression" aria-label="Выражение"><option>neutral</option></select></label><label>Сила выражения<input id="amount" aria-label="Сила выражения" type="range" min="0" max="1" step=".01" value="0"></label><button id="neutral">Нейтрально</button><div id="status" role="status">Ожидание файла</div></aside>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/three/loaders/GLTFLoader.js';import {OrbitControls} from './vendor/three/controls/OrbitControls.js';import {VRMLoaderPlugin} from './vendor/three-vrm/three-vrm.module.js';
const $=id=>document.getElementById(id),renderer=new T.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new T.Scene();scene.background=new T.Color('#14161c');scene.add(new T.HemisphereLight(0xdce7ff,0x373038,2));const light=new T.DirectionalLight(0xffeee4,3);light.position.set(-2,4,4);scene.add(light);const camera=new T.PerspectiveCamera(40,1,.01,100),controls=new OrbitControls(camera,$('c'));controls.enableDamping=true;let vrm=null;
const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));
function fit(){if(!vrm)return;const box=new T.Box3().setFromObject(vrm.scene),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3()),dist=Math.max(size.y,size.x/camera.aspect)/(2*Math.tan(T.MathUtils.degToRad(20)))*1.2;controls.target.copy(center);camera.position.copy(center).add(new T.Vector3(.2,.03,1).normalize().multiplyScalar(dist));controls.update();}
function apply(){if(!vrm)return;for(const e of vrm.expressionManager.expressions)vrm.expressionManager.setValue(e.expressionName,0);vrm.expressionManager.setValue($('expression').value,Number($('amount').value));vrm.update(0);}
async function load(url){$('status').textContent='Загрузка…';try{const gltf=await loader.loadAsync(url),next=gltf.userData.vrm;if(next?.meta?.metaVersion!=='1')throw Error('Ожидается VRM 1.0');if(vrm)scene.remove(vrm.scene);vrm=next;scene.add(vrm.scene);vrm.update(0);$('expression').replaceChildren(...vrm.expressionManager.expressions.map(e=>new Option(e.expressionName,e.expressionName)));$('status').textContent='VRM 1.0 · '+vrm.expressionManager.expressions.length+' выражений · загружен';fit();}catch(e){$('status').textContent=e.message;console.error(e);}}
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(f){const u=URL.createObjectURL(f);try{await load(u);}finally{URL.revokeObjectURL(u);}}};$('fit').onclick=fit;$('head').onclick=()=>{if(vrm){const p=vrm.humanoid.getRawBoneNode('head').getWorldPosition(new T.Vector3()).add(new T.Vector3(0,.07,0));controls.target.copy(p);camera.position.copy(p).add(new T.Vector3(.1,.02,.65));controls.update();}};$('expression').onchange=apply;$('amount').oninput=apply;$('neutral').onclick=()=>{$('amount').value=0;apply();};
renderer.setAnimationLoop(()=>{const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();controls.update();renderer.render(scene,camera);});const source=new URLSearchParams(location.search).get('src');if(source)load(source);
</script></html>
