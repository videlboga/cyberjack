<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900"><rect width="1560" height="900" fill="#FCFDFD"/><defs><pattern id="h45" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#6E767D" stroke-width="1.0"/></pattern><pattern id="h135" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#6E767D" stroke-width="1.0"/></pattern><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1E2328"/></marker></defs><text x="46" y="52" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#1E2328">Фиксатор — лист 3: кинематика узла</text><text x="46" y="78" font-family="DejaVu Sans" font-size="12.5" fill="#8A9299">три движения на конечность: каретка по пазу, стойка по высоте, консоль поворотом · без деталей, только степени</text><line x1="240.0" y1="560.0" x2="953.0" y2="560.0" stroke="#1E2328" stroke-width="2.6" stroke-linecap="butt"/><text x="240.0" y="582.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="start" font-weight="400">плоскость стола</text><path d="M 332.99999999999994 560 L 705.0 560 L 705.0 606 L 332.99999999999994 606 Z" fill="none" stroke="#4C545C" stroke-width="1.2" stroke-dasharray="8 6"/><text x="519.0" y="626.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="middle" font-weight="400">паз 600 (ось движения каретки)</text><line x1="345.4" y1="550.0" x2="692.6" y2="550.0" stroke="#4C545C" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#ar)"/><line x1="692.6" y1="550.0" x2="345.4" y2="550.0" stroke="#4C545C" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#ar)"/><text x="519.0" y="538.0" font-family="DejaVu Sans" font-size="12" fill="#4C545C" text-anchor="middle" font-weight="400">ход каретки 520</text><rect x="348.0" y="556.0" width="32.0" height="22.0" rx="3.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.6"/><circle cx="364.0" cy="569.0" r="4.0" fill="#1E2328" stroke="#1E2328" stroke-width="0.8"/><text x="364.0" y="600.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="middle" font-weight="400">1</text><rect x="503.0" y="556.0" width="32.0" height="22.0" rx="3.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.6"/><circle cx="519.0" cy="569.0" r="4.0" fill="#1E2328" stroke="#1E2328" stroke-width="0.8"/><text x="519.0" y="600.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="middle" font-weight="400">2</text><rect x="658.0" y="556.0" width="32.0" height="22.0" rx="3.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.6"/><circle cx="674.0" cy="569.0" r="4.0" fill="#1E2328" stroke="#1E2328" stroke-width="0.8"/><text x="674.0" y="600.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="middle" font-weight="400">3</text><line x1="674.0" y1="556.0" x2="674.0" y2="310.0" stroke="#1E2328" stroke-width="2.6" stroke-linecap="butt"/><line x1="619.0" y1="500.0" x2="619.0" y2="310.0" stroke="#8A9299" stroke-width="0.8" stroke-linecap="butt"/><line x1="614.0" y1="500.0" x2="624.0" y2="500.0" stroke="#8A9299" stroke-width="0.8" stroke-linecap="butt"/><line x1="614.0" y1="310.0" x2="624.0" y2="310.0" stroke="#8A9299" stroke-width="0.8" stroke-linecap="butt"/><text x="608.0" y="405.0" font-family="DejaVu Sans" font-size="12" fill="#8A9299" text-anchor="middle" font-weight="400" transform="rotate(-90 608.0 405.0)">высота 60…180</text><line x1="674.0" y1="310.0" x2="444.0" y2="310.0" stroke="#1E2328" stroke-width="2.6" stroke-linecap="butt"/><text x="442.0" y="298.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="start" font-weight="400">консоль 230</text><path d="M 444.0 310 A 230 230 0 0 1 514.0 530" fill="none" stroke="#4C545C" stroke-width="1.0" stroke-dasharray="6 5"/><path d="M 444.0 310 A 230 230 0 0 0 834.0 530" fill="none" stroke="#4C545C" stroke-width="1.0" stroke-dasharray="6 5"/><line x1="674.0" y1="310.0" x2="904.0" y2="310.0" stroke="#4C545C" stroke-width="1.0" stroke-linecap="butt" stroke-dasharray="6 5"/><text x="764.0" y="298.0" font-family="DejaVu Sans" font-size="11.5" fill="#4C545C" text-anchor="start" font-weight="400">поворот 360°</text><line x1="484.0" y1="310.0" x2="484.0" y2="500.0" stroke="#4C545C" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="4 4"/><line x1="472.0" y1="498.0" x2="496.0" y2="498.0" stroke="#1E2328" stroke-width="3.4" stroke-linecap="butt"/><text x="374.0" y="504.0" font-family="DejaVu Sans" font-size="11.5" fill="#8A9299" text-anchor="start" font-weight="400">винт: ход 28</text><text x="60.0" y="700.0" font-family="DejaVu Sans" font-size="14" fill="#1E2328" text-anchor="start" font-weight="700">ТРИ ДВИЖЕНИЯ — ТРИ РУЧКИ</text><circle cx="70.0" cy="732.0" r="10.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.3"/><text x="70.0" y="736.0" font-family="DejaVu Sans" font-size="11.5" fill="#1E2328" text-anchor="middle" font-weight="700">1</text><text x="90.0" y="736.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="700">каретка</text><text x="190.0" y="736.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">вдоль паза, 520 мм, стопор-рычаг снизу</text><circle cx="70.0" cy="762.0" r="10.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.3"/><text x="70.0" y="766.0" font-family="DejaVu Sans" font-size="11.5" fill="#1E2328" text-anchor="middle" font-weight="700">2</text><text x="90.0" y="766.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="700">стойка</text><text x="190.0" y="766.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">по высоте 60…180, фиксация гайкой</text><circle cx="70.0" cy="792.0" r="10.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.3"/><text x="70.0" y="796.0" font-family="DejaVu Sans" font-size="11.5" fill="#1E2328" text-anchor="middle" font-weight="700">3</text><text x="90.0" y="796.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="700">консоль</text><text x="190.0" y="796.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">поворот 360° вокруг стойки</text><circle cx="70.0" cy="822.0" r="10.0" fill="#FFFFFF" stroke="#1E2328" stroke-width="1.3"/><text x="70.0" y="826.0" font-family="DejaVu Sans" font-size="11.5" fill="#1E2328" text-anchor="middle" font-weight="700">4</text><text x="90.0" y="826.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="700">винт</text><text x="190.0" y="826.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">затяжка пяты, ход 28 мм</text><text x="700.0" y="700.0" font-family="DejaVu Sans" font-size="14" fill="#1E2328" text-anchor="start" font-weight="700">ЧЕГО В СХЕМЕ НЕТ</text><text x="700.0" y="736.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">·  приводов — все положения выставляет человек</text><text x="700.0" y="766.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">·  обратной задачи — конечность не «ведут», её кладут и прижимают</text><text x="700.0" y="796.0" font-family="DejaVu Sans" font-size="12.5" fill="#1E2328" text-anchor="start" font-weight="400">·  синхронизации с телом — тело лежит, машина подводится к нему</text></svg>