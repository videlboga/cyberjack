<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffe6e6; border: 1px solid #ffcccc; }
        .success { background: #e6ffe6; border: 1px solid #ccffcc; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>API Test Page</h1>

    <button onclick="testSimpleAPI()">Test Simple API</button>
    <button onclick="testConfigAPI()">Test Config API</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <script>
        function addResult(title, content, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(content, null, 2)}</pre>`;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testSimpleAPI() {
            try {
                console.log('Testing simple API...');
                const response = await fetch('/api/test');
                const data = await response.json();
                addResult('Simple API Test', data);
                console.log('Simple API response:', data);
            } catch (error) {
                addResult('Simple API Error', error, true);
                console.error('Simple API error:', error);
            }
        }

        async function testConfigAPI() {
            try {
                console.log('Testing config API...');
                const startTime = Date.now();
                const response = await fetch('/api/db/config', {
                    cache: 'no-store',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const endTime = Date.now();

                console.log('Config API response time:', endTime - startTime + 'ms');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                addResult('Config API Test', {
                    success: data.success,
                    responseTime: endTime - startTime + 'ms',
                    charactersCount: data.config?.characters?.length || 0,
                    actionsCount: Object.keys(data.config?.characterAI?.actions || {}).length,
                    toolsCount: Object.keys(data.config?.characterAI?.tools || {}).length
                });
                console.log('Config API response:', data);
            } catch (error) {
                addResult('Config API Error', {
                    error: error.message,
                    stack: error.stack
                }, true);
                console.error('Config API error:', error);
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testSimpleAPI();
                setTimeout(() => testConfigAPI(), 1000);
            }, 1000);
        });
    </script>
</body>
</html>
